<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服部研究室 | Hattori Lab, Keio SFC</title>
  <meta name="description" content="慶應義塾大学 湘南藤沢キャンパス（SFC）の服部研究室。森の中で、知能を設計する。">
  <meta name="theme-color" content="#0F3D2E">
  <link rel="icon" type="image/png" href="data/hhlab.png">
  <link rel="apple-touch-icon" href="data/hhlab.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Zen+Kaku+Gothic+New:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>
</head>
<body>
  <a class="skip" href="#research" data-i18n="skip">本文へ</a>

  <header class="nav" id="nav">
    <a class="nav__brand" href="#top"><img class="nav__logo" src="data/hhlab.png" alt="" width="308" height="307" decoding="async"><span class="nav__text" data-i18n="lab">服部研究室</span></a>
    <nav aria-label="ページ内リンク" data-i18n-aria-label="navigation">
      <ul>
        <li><a href="#research" data-i18n="research">研究</a></li>
        <li><a href="#past-research" data-i18n="archive">過去の研究</a></li>
        <li><a href="#members" data-i18n="members">メンバー</a></li>
        <li><a href="#about" data-i18n="about">研究室紹介</a></li>
        <li><a href="#access" data-i18n="access">アクセス</a></li>
      </ul>
    </nav>
    <div class="language-switch" role="group" aria-label="表示言語" data-i18n-aria-label="language">
      <button type="button" data-language="ja" lang="ja" aria-pressed="true">日本語</button>
      <button type="button" data-language="en" lang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <main id="top">
    <!-- Hero: 森のように揺れる緑の光点。マウスに反応する -->
    <section class="hero" aria-label="服部研究室" data-i18n-aria-label="lab">
      <canvas id="field" aria-hidden="true"></canvas>
      <div class="hero__inner">
        <p class="hero__en" lang="en">Hattori Lab <span>Keio University SFC</span></p>
        <h1 data-i18n="lab">服部研究室</h1>
        <p class="hero__tag" data-i18n="tagline">森の中で、知能を設計する。</p>
      </div>
      <a class="hero__scroll" href="#research" aria-label="下へスクロール" data-i18n-aria-label="scroll"><span></span></a>
    </section>

    <!-- Research -->
    <section id="research" class="section section--white">
      <div class="wrap">
        <h2 class="title"><span class="title__en" lang="en">Research</span><span class="title__ja">研究テーマ</span></h2>
        <div class="research" id="research-grid"></div>
      </div>
    </section>

    <!-- Past Research -->
    <section id="past-research" class="section section--white section--archive" aria-labelledby="past-research-title">
      <div class="wrap">
        <div class="archive">
          <h2 class="title" id="past-research-title"><span class="title__en" lang="en">Past Research</span><span class="title__ja">これまでの研究</span></h2>
          <div id="research-archive"></div>
          <details class="archive__more" id="research-more">
            <summary class="archive__summary">
              <span data-i18n="otherResearch">その他の研究・活動</span>
              <span class="archive__count" id="research-more-count"></span>
            </summary>
            <div id="research-archive-more"></div>
          </details>
        </div>
      </div>
    </section>

    <!-- Members: 研究室のドアに掛かる「在室ボード」。名札を役職ごとの段に並べる -->
    <section id="members" class="section section--mist">
      <div class="wrap">
        <h2 class="title"><span class="title__en" lang="en">Members</span><span class="title__ja">メンバー</span></h2>
        <div class="board" id="member-board">
          <!-- 段は js/members.js が data/members.js から生成 -->
        </div>
      </div>
    </section>

    <!-- About: 研究室の説明と扱っているテーマ -->
    <section id="about" class="section section--white">
      <div class="wrap about">
        <div class="about__body">
          <h2 class="title"><span class="title__en" lang="en">About</span><span class="title__ja">研究室について</span></h2>
          <div id="about-lead"></div>
        </div>
        <div class="seminar" id="about-seminar"></div>
      </div>
    </section>

    <!-- Access -->
    <section id="access" class="section section--mist">
      <div class="wrap access">
        <div class="access__body">
          <h2 class="title"><span class="title__en" lang="en">Access</span><span class="title__ja">アクセス</span></h2>
          <p class="access__place" data-i18n="campus">慶應義塾大学 湘南藤沢キャンパス</p>
          <p class="access__addr" data-i18n="address">〒252-0882 神奈川県藤沢市遠藤5322</p>
        </div>
        <div class="access__map">
          <img src="data/sfc-campus-concept.png"
               alt="白い校舎と池、緑豊かな並木道を描いた湘南藤沢キャンパスの建築コンセプトアート"
               data-i18n-alt="campusAlt"
               width="1536" height="1024" loading="lazy" decoding="async">
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span class="foot__mark" aria-hidden="true"></span>
    <span lang="en">Hattori Lab, Keio University SFC</span>
  </footer>

  <script src="data/members.js"></script>
  <script src="data/content.js"></script>
  <script src="js/field.js"></script>
  <script src="js/members.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
